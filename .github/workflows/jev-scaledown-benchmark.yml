name: Jev ScaleDown benchmark
on:
  pull_request:
    paths:
      - ai_agents/agents/examples/jev-turn-control/validation/scaledown-reasoning-20260927/**
      - .github/workflows/jev-scaledown-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==9.1.1 black==26.5.1 pylint==3.3.8
      - name: Verify captured wire evidence and reproduce metrics without credentials
        working-directory: ai_agents/agents/examples/jev-turn-control/validation/scaledown-reasoning-20260927
        run: |
          python -m black --check --line-length 80 src
          python -m pylint --rcfile="$GITHUB_WORKSPACE/tools/pylint/.pylintrc" src
          python -m pytest -q src/test_analysis.py
          python src/analyze.py
          git diff --exit-code -- results/metrics.json results/audit.json
