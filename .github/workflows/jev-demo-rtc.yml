name: Jev demo RTC
on:
  push:
    branches: [feat/jev-demo-rtc, chore/jev-oss-bootstrap]
    paths: ['ai_agents/agents/examples/jev-demo-rtc/**', '.github/workflows/jev-demo-rtc.yml']
  pull_request:
    paths: ['ai_agents/agents/examples/jev-demo-rtc/**', '.github/workflows/jev-demo-rtc.yml']
permissions:
  contents: read
jobs:
  rtc:
    if: github.repository == 'TomasBack2Future/ten-framework'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ai_agents/agents/examples/jev-demo-rtc/web/package-lock.json
    - name: Check browser and server code
      working-directory: ai_agents/agents/examples/jev-demo-rtc/web
      run: npm ci --ignore-scripts && npm run check && npm test
    - name: Check bridge and graph code
      run: python3 -m unittest discover -s ai_agents/agents/examples/jev-demo-rtc/tests -v
    - name: Fetch pinned TEN manager
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .bootstrap/tools
        gh release download 0.11.73 --repo TEN-framework/ten-framework --pattern tman-linux-release-x64.zip --dir .bootstrap/tools
        cd .bootstrap/tools
        echo '1ac22f455cc0be5f2541701bd38cacecc918f41a1b1b891889c71914cc3b3ab2  tman-linux-release-x64.zip' | sha256sum -c -
        unzip -q tman-linux-release-x64.zip
    - name: Build independent RTC image
      run: docker build --platform linux/amd64 --build-arg REVISION=${{ github.sha }} -t ghcr.io/tomasback2future/jev-demo-rtc:${{ github.sha }} -f ai_agents/agents/examples/jev-demo-rtc/Dockerfile .
    - name: Smoke runtime and token server
      run: |
        image=ghcr.io/tomasback2future/jev-demo-rtc:${{ github.sha }}
        docker run --rm --network none -e JEV_SESSION_ID=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -e JEV_GRAPH_PORT=8766 --entrypoint bash "$image" -lc '.venv/bin/python scripts/run_graph.py --write-only /tmp/rtc-graph.json && cd tenapp && /opt/ten_manager/bin/tman check property-json --path /tmp/rtc-graph.json'
        docker run --rm --network none "$image" .venv/bin/python -m unittest discover -s tests -v
        docker run -d --name jev-rtc-smoke -p 127.0.0.1:3300:3000 -e AGORA_APP_CERTIFICATE=00000000000000000000000000000000 -e JEV_GRAPH_COMMAND=true "$image"
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:3300/healthz | grep -q '"transport":"rtc"'; then exit 0; fi
          sleep 1
        done
        docker logs jev-rtc-smoke
        exit 1
    - uses: docker/login-action@v3
      if: github.event_name == 'push'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish tested image
      if: github.event_name == 'push'
      run: docker push ghcr.io/tomasback2future/jev-demo-rtc:${{ github.sha }}
